    <!-- Schema: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Apa itu borepile dan kapan saya butuh?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Borepile adalah teknik pengeboran dalam untuk pondasi bangunan. Anda butuh borepile jika membangun rumah bertingkat, ruko, atau gedung di area dengan kondisi tanah lunak. Kami melayani jasa bore pile di Jakarta, Bogor, Depok, Tangerang, Bekasi, dan seluruh Indonesia."
          }
        },
        {
          "@type": "Question",
          "name": "Berapa biaya jasa bore pile per titik?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Biaya jasa mulai dari Rp800.000 per titik untuk strauss pile manual (diameter 30–40 cm) dan mulai Rp2.500.000 per titik untuk bore pile mesin mini crane. Harga adalah estimasi kisaran pasar wilayah Jabodetabek per Oktober 2026 dan bukan harga pasti. Biaya final dapat berbeda mengikuti kondisi tanah, diameter, kedalaman, akses lokasi, jumlah titik, dan harga material. Penawaran resmi (RAB) diberikan setelah survey lokasi gratis."
          }
        },
        {
          "@type": "Question",
          "name": "Berapa lama proses pengerjaan bore pile dari survey hingga selesai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Setelah survey lokasi dan deal disepakati, tim kami dapat mulai mobilisasi dalam 1x24 jam. Proses pengeboran rata-rata 1-3 hari per titik, atau total 3-7 hari kerja untuk proyek rumah atau ruko standar tergantung jumlah titik dan kondisi tanah."
          }
        },
        {
          "@type": "Question",
          "name": "Apakah survey lokasi gratis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ya, survey lokasi dan konsultasi awal GRATIS tanpa biaya. Kami akan datang ke lokasi untuk mengukur kondisi tanah dan kebutuhan pengeboran Anda di seluruh Jabodetabek dan Karawang-Cikarang-Purwakarta area."
          }
        },
        {
          "@type": "Question",
          "name": "Gimana kalau hasil pengeboran gak keluar air?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kami akan evaluasi dan cari solusi terbaik, termasuk pengeboran ulang di titik lain jika diperlukan. Pekerjaan akan disesuaikan dengan hasil yang disepakati awal. Tim kami ahli dalam kondisi tanah keras di Jakarta dan sekitarnya."
          }
        },
        {
          "@type": "Question",
          "name": "Wilayah mana saja yang dilayani?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kami melayani seluruh wilayah Jabodetabek termasuk Jakarta Pusat, Utara, Barat, Selatan, dan Timur. Selain itu Karawang, Cikarang, Purwakarta, Serang, Cilegon, Subang, Cianjur, dan proyek di seluruh Indonesia."
          }
        },
        {
          "@type": "Question",
          "name": "Bagaimana dengan kualitas dan standar pekerjaan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Setiap pekerjaan dilakukan sesuai standar teknis yang berlaku oleh tim berpengalaman 12+ tahun. Hasil pengeboran diverifikasi berdasarkan spesifikasi yang telah disepakati sebelumnya bersama klien."
          }
        },
        {
          "@type": "Question",
          "name": "Apa perbedaan bore pile mesin dan strauss pile manual?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bore pile mesin menggunakan rig bertenaga mesin untuk pengeboran dalam diameter 30-100cm dengan kedalaman hingga 30 meter. Strauss pile manual menggunakan tenaga putar manusia untuk diameter 30-40cm pada kedalaman 6-15 meter. Kami menyediakan keduanya sesuai kebutuhan proyek Anda."
          }
        }
      ]
    }
